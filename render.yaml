# Render Blueprint — deploys the B2 API + a managed Postgres in one go.
# Dashboard: New -> Blueprint -> pick this repo. Render reads this file
# automatically. See DEPLOY.md for the full runbook (migrations, seeding,
# connecting the Vercel frontend).
databases:
  - name: skillcase-b2-db
    plan: free

services:
  - type: web
    name: skillcase-b2-api
    runtime: node
    rootDir: app/server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skillcase-b2-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: REVIEW_TOKEN
        generateValue: true
